name: Correção do Projeto 7 — 4º Bimestre

on:
  push:
    paths:
      - "4-bimestre/orientacao-a-objetos/projetos/projeto7/**"

jobs:
  correcao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Identificar aluno
        run: |
          ALUNO="${{ github.actor }}"

          echo "Aluno identificado: $ALUNO"
          echo "Pasta que será testada:"
          echo "4-bimestre/orientacao-a-objetos/projetos/projeto7/$ALUNO"

      - name: Verificar pasta do aluno
        run: |
          ALUNO="${{ github.actor }}"
          PASTA="4-bimestre/orientacao-a-objetos/projetos/projeto7/$ALUNO"

          if [ -d "$PASTA" ]; then
            echo "✅ Pasta encontrada!"
            echo "Testando: $PASTA"
          else
            echo "❌ Pasta do aluno não encontrada!"
            echo "Esperado: $PASTA"
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: 4-bimestre/orientacao-a-objetos/projetos/projeto7/${{ github.actor }}
        run: npm install

      - name: Rodar testes
        id: testes
        working-directory: 4-bimestre/orientacao-a-objetos/projetos/projeto7/${{ github.actor }}
        run: npm test

      # Roda mesmo com teste falhando, para o aluno ver os dois problemas de uma vez.
      - name: Verificar coleção do Bruno
        if: success() || steps.testes.conclusion == 'failure'
        working-directory: 4-bimestre/orientacao-a-objetos/projetos/projeto7/${{ github.actor }}
        run: |
          if [ -f colecao/bruno.json ] || [ -f colecao/opencollection.yml ]; then
            echo "✅ Coleção do Bruno encontrada!"
          else
            echo "::error::Coleção do Bruno não encontrada. Crie a coleção com o nome colecao, na pasta do projeto, e envie a pasta no git push."
            exit 1
          fi
